name: DoubleShot
options:
  bundleIdPrefix: com.jparrack
  createIntermediateGroups: true
targets:
  DoubleShot:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: DoubleShot
      - path: scripts/enable-lid-mode.sh
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jparrack.doubleshot
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true
        # Not sandboxed: the whole app is a reader of ~/.claude/projects.
        ENABLE_APP_SANDBOX: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
    info:
      path: DoubleShot/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: DoubleShot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Required for App Store submission; also what Finder groups the app under.
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "Copyright © 2026 Jeremiah Parrack. MIT licensed."
